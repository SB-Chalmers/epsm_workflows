[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_workflows"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["epsm_core>=0.2.0", "epsm_data>=0.4.0"]

[project.optional-dependencies]
epsm = ["epsm"]
epc = ["duckdb>=1.5,<2", "pyarrow>=23,<24", "pyproj>=3.6,<4", "shapely>=2.1,<3"]
weather = ["smhi2epw"]

[project.scripts]
epsm-evaluations = "epsm_workflows.execution:main"

[tool.setuptools.dynamic]
version = {attr = "epsm_workflows._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_workflows"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".venv", "build", "dist"]
