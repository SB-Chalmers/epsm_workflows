[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_workflows"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["epsm_core==0.1.0.dev0", "duckdb>=1.5,<2", "pyarrow>=23,<24", "pandas>=2.2,<3", "scipy>=1.17,<2", "scikit-learn>=1.8,<2", "pyproj>=3.6,<4"]

[project.optional-dependencies]
geometry-study = ["epsm_core[geometry]==0.1.0.dev0", "matplotlib>=3.9"]
review = ["matplotlib>=3.9", "smhi2epw"]

[tool.setuptools.dynamic]
version = {attr = "epsm_workflows._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epsm_workflows = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

