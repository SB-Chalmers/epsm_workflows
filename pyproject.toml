[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_workflows"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["epsm_core==0.1.0.dev0"]

[project.optional-dependencies]
campaign = ["duckdb>=1.5,<2", "numpy>=2,<3", "scipy>=1.17,<2"]
epc = ["duckdb>=1.5,<2", "pyarrow>=23,<24", "pyproj>=3.6,<4", "shapely>=2.1,<3"]
validation = []
weather = ["smhi2epw"]

[project.scripts]
epsm-workflows = "epsm_workflows.cli:main"

[tool.setuptools.dynamic]
version = {attr = "epsm_workflows._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epsm_workflows = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
