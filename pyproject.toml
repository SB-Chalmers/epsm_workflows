[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_workflows"
dynamic = ["version"]
description = "Reusable EPSM study designs, renovation search and prepared execution"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["epsm_core>=0.9.0", "epsm_data>=0.7.0"]

[project.urls]
Repository = "https://github.com/SB-Chalmers/epsm_workflows"

[project.optional-dependencies]
epsm = ["epsm>=0.5.0"]
epc = ["duckdb>=1.5,<2", "pyarrow>=23,<24", "pyproj>=3.6,<4", "shapely>=2.1,<3"]
weather = ["smhi2epw>=1.3.0,<2"]
# Authoring a Vera campaign package; Vera itself needs only epsm_core, duckdb and numpy.
campaign = ["duckdb>=1.5,<2", "numpy>=2,<3", "scipy>=1.17,<2", "shapely>=2.1,<3"]

[project.scripts]
epsm-evaluations = "epsm_workflows.execution:main"
epsm-campaign = "epsm_workflows.campaign.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "epsm_workflows._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_workflows", "epsm_workflows.campaign"]
namespaces = false

[tool.setuptools.package-data]
"epsm_workflows.campaign" = ["data/*.json", "data/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".venv", "build", "dist"]
markers = ["slow: regenerates the full 60k design table (about half a minute)"]
