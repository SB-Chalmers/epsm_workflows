name: Workflows release checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      development_dependencies:
        description: Check current dependency main branches on Python 3.13
        type: boolean
        default: false
      candidate_manifest_revision:
        description: Immutable EPSM SHA containing compatibility-candidate.json; empty uses supported pins
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  combination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm
          ssh-key: ${{ secrets.EPSM_REPO_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ inputs.candidate_manifest_revision || 'main' }}
          path: .ci/platform
          sparse-checkout: |
            /compatibility.json
            /compatibility-candidate.json
            /scripts/compatibility_matrix.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: matrix
        env:
          MATRIX_MODE: ${{ inputs.development_dependencies && 'main' || 'pinned' }}
          CANDIDATE_REVISION: ${{ inputs.candidate_manifest_revision }}
          PLATFORM_MANIFEST: ${{ inputs.candidate_manifest_revision && '.ci/platform/compatibility-candidate.json' || '.ci/platform/compatibility.json' }}
        run: |
          echo "EPSM manifest: $(git -C .ci/platform rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          candidate_args=()
          if [[ -n "$CANDIDATE_REVISION" ]]; then
            candidate_args=(--candidate-revision "$CANDIDATE_REVISION" --consumer-revision "$(git rev-parse HEAD)")
          fi
          python .ci/platform/scripts/compatibility_matrix.py \
            --manifest "$PLATFORM_MANIFEST" --consumer epsm_workflows \
            --packages epsm_data epsm_core epsm_lca epsm_rc epsm smhi2epw \
            --manifest-revision "$(git -C .ci/platform rev-parse HEAD)" \
            --mode "$MATRIX_MODE" "${candidate_args[@]}" >> "$GITHUB_OUTPUT"
  package:
    name: package (${{ matrix.python }})
    needs: combination
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.combination.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_data }}
          path: .ci/epsm_data
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_core }}
          path: .ci/epsm_core
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_lca
          ssh-key: ${{ secrets.EPSM_LCA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_lca }}
          path: .ci/epsm_lca
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_rc
          ssh-key: ${{ secrets.EPSM_RC_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_rc }}
          path: .ci/epsm_rc
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm
          ssh-key: ${{ secrets.EPSM_REPO_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm }}
          path: .ci/epsm
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/smhi2epw
          ref: ${{ matrix.smhi2epw }}
          path: .ci/smhi2epw
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build and install coordinated wheels
        run: |
          python -m pip install build pytest
          for package in epsm_data epsm_core epsm_lca epsm_rc epsm smhi2epw; do
            python -m build --wheel --outdir .ci/wheels ".ci/$package"
          done
          python -m build --wheel --outdir .ci/wheels .
          python -m pip install .ci/wheels/*.whl
          python -m pip install 'epsm_workflows[epc,epsm,weather]'
          python -m pip check
      - name: Require installed public imports
        run: |
          cd /tmp
          python - <<'PYTHON'
          import importlib
          import importlib.metadata
          import importlib.util
          import json
          from pathlib import Path
          for name in ("epsm_workflows", "epsm", "epsm_core", "epsm_rc", "epsm_data", "epsm_lca"):
              module = importlib.import_module(name)
              assert "site-packages" in Path(module.__file__).resolve().parts, (name, module.__file__)
              direct = importlib.metadata.distribution(name).read_text("direct_url.json")
              assert not direct or not json.loads(direct).get("dir_info", {}).get("editable"), (name, direct)
          assert importlib.util.find_spec("epsm_workflows.cohorts") is None
          from epsm_workflows import PreparedEvaluation, optimise_renovations
          print(PreparedEvaluation, optimise_renovations)
          PYTHON
      - name: Run full workflows suite against installed wheels
        run: python -m pytest -q
