name: Development checks
'on':
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Download the supported sibling wheels from the EPSM release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        curl --fail --silent --location -o .ci-compatibility.json \
          https://raw.githubusercontent.com/SB-Chalmers/epsm/main/compatibility.json
        release=$(python -c "import json; print('v' + json.load(open('.ci-compatibility.json'))['packages']['epsm']['version'])")
        mkdir -p .ci/wheels
        gh release download "$release" --repo SB-Chalmers/epsm --dir .ci/wheels \
          --pattern 'epsm_data-*.whl' --pattern 'epsm_core-*.whl' --pattern compatibility.json
        python - <<'PYTHON'
        import json
        from pathlib import Path
        supported = json.load(open('.ci-compatibility.json'))['packages']
        released = json.load(open('.ci/wheels/compatibility.json'))['packages']
        for name in ['epsm_data', 'epsm_core']:
            wheel = next(Path('.ci/wheels').glob(f'{name}-*.whl'))
            version = wheel.name.split('-')[1]
            assert version == supported[name]['version'] == released[name]['version'], (name, version, supported[name], released[name])
            assert supported[name]['revision'] == released[name]['revision'], (name, 'release built from another revision')
            print(f'{name} {version} from {wheel.name}')
        PYTHON
    - name: Install development prerequisites
      run: python -m pip install build pytest jsonschema .ci/wheels/*.whl .
    - name: Run offline development checks
      run: |
        python -m pytest -q tests/test_distributions.py tests/test_distribution.py tests/test_harmonised_workflows.py tests/test_outcome_collection.py tests/test_prepared_runtime.py tests/test_validation.py tests/test_workflow_events.py tests/test_workflow_inspection.py tests/test_workflow_sampling_reuse.py
        python -m build --wheel
